name: auvoryn
description: AUVORYN — an immersive, offline-first personal music player.
publish_to: none
version: 0.7.0+8

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  shared_preferences: ^2.5.6
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  audio_session: ^0.2.3
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  audio_metadata_reader: ^1.8.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4+2
  path: ^1.9.1
  crypto: ^3.0.6
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ambience/
